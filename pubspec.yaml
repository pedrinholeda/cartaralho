name: cartaralho
description: "Cartaralho - Flutter version with Firebase integration"
publish_to: "none"

version: 0.13.0+13

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.17.5

  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1

  # Efeitos sonoros e a preferência de mudo (localStorage na web)
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/baralhos/
    - assets/sons/
    - assets/musicas/

# Ícones do app gerados a partir do logo escolhido (docs/marca/logo-carta-escura.png).
# Depois de trocar o logo: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: docs/marca/logo-carta-escura.png
  android: true
  ios: false
  web:
    generate: true
    background_color: "#000000"
    theme_color: "#D7282F"
