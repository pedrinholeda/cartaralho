name: release-please

# Lê os Conventional Commits da main, mantém o CHANGELOG.md e a versão, e deixa um PR de
# release aberto. Fazer merge desse PR cria a tag vX.Y.Z e a Release no GitHub.
# Precisa de "Allow GitHub Actions to create and approve pull requests" no repositório.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
    outputs:
      criou: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}

  # Quando o merge do PR de release cria a Release, monta o APK e anexa nela.
  apk:
    needs: release-please
    if: needs.release-please.outputs.criou == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Anexar o APK na Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "cartaralho-${{ needs.release-please.outputs.tag }}.apk"
          gh release upload "${{ needs.release-please.outputs.tag }}" "cartaralho-${{ needs.release-please.outputs.tag }}.apk" --clobber
