name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Fixado para o lint e o pubspec.lock baterem com o ambiente local.
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Lint
        run: flutter analyze
      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Testes
        run: flutter test
      - name: Build web
        run: flutter build web

  android:
    # O APK monta à parte: se o Gradle quebrar, o resto do CI segue verde.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: cartaralho-apk
          path: build/app/outputs/flutter-apk/app-release.apk
